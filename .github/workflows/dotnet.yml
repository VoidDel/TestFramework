name: .NET

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore TestFramework.sln

      # Every project here is a library, a plugin or a headless test project. Since the desktop
      # host moved out of this repository there is nothing left that needs a display, so both
      # legs build and test the whole solution rather than a per-OS subset.
      - name: Build solution
        run: dotnet build TestFramework.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test TestFramework.sln --configuration Release --no-build

      # The release workflow only runs on a tag, so a packaging break would otherwise surface at
      # release time. Packing here proves the five libraries still produce their packages.
      - name: Pack smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet pack TestFramework.sln --configuration Release --no-build --output pack-smoke
          $packages = Get-ChildItem pack-smoke/*.nupkg | Select-Object -ExpandProperty Name
          Write-Host ($packages -join "`n")
          if ($packages.Count -ne 5) { throw "Expected 5 packages, found $($packages.Count)" }

      # The built-in step plugins are delivered as files into a host's Plugins/ directory, not as a
      # package, so their staging is not covered by the pack smoke test. A host copies from this
      # folder, which makes an empty one a broken delivery.
      - name: Plugin packages staged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = [ordered]@{
            'BasicSteps'      = @('TestFramework.Plugins.BasicSteps.dll', 'TestFramework.Plugins.BasicSteps.UI.dll')
            'InstrumentSteps' = @('TestFramework.Plugins.InstrumentSteps.dll')
            'Simulation'      = @('TestFramework.Plugins.Simulation.dll')
          }
          foreach ($name in $packages.Keys) {
            $staged = Get-ChildItem "artifacts/plugins/$name" -Filter *.dll -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
            Write-Host "$($name): $($staged -join ', ')"
            foreach ($expected in $packages[$name]) {
              if ($staged -notcontains $expected) { throw "Missing staged plugin: $name/$expected" }
            }
            # The instrument classes are shared from the host; a copy staged here would be ignored.
            if ($staged -contains 'TestFramework.Instruments.dll') { throw "$name stages TestFramework.Instruments.dll, which the host provides" }
          }
