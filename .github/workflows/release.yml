name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore TestFramework.sln

      # Build the whole solution explicitly. `dotnet test` builds only the test projects and what
      # they reference; since the desktop host and its tests left this repository, nothing under
      # test references Plugin.Abstractions.UI or the plugin UI package, so a test-only build
      # leaves them - and the staged plugin package - missing for the pack and zip steps below.
      - name: Build
        run: dotnet build TestFramework.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TestFramework.sln --configuration Release --no-build

      # All four shipped libraries: the two plugin contracts, and Core and SequenceYaml which a
      # host references. Packing the solution picks up exactly the projects marked IsPackable.
      - name: Pack libraries
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet pack TestFramework.sln --configuration Release --no-build --output artifacts -p:PackageVersion=$version
          $expected = @('TestFramework.Abstractions', 'TestFramework.Plugin.Abstractions.UI', 'TestFramework.Core', 'TestFramework.SequenceYaml')
          foreach ($package in $expected) {
            if (-not (Test-Path "artifacts/$package.$version.nupkg")) { throw "Missing package: $package.$version.nupkg" }
          }

      # The built-in step plugins ship as files, not as a package: a host has no compile-time
      # dependency on a plugin, so there is nothing for it to reference. A host unpacks this zip
      # into the folder it stages its Plugins/ directory from.
      - name: Zip the built-in plugin package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($expected in @('TestFramework.Plugins.BasicSteps.dll', 'TestFramework.Plugins.BasicSteps.UI.dll')) {
            if (-not (Test-Path "artifacts/plugins/BasicSteps/$expected")) { throw "Missing staged plugin: $expected" }
          }
          Compress-Archive -Path artifacts/plugins/BasicSteps/* -DestinationPath "artifacts/TestFramework.Plugins.BasicSteps-$version.zip" -Force

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: TestFramework-packages-${{ github.ref_name }}
          path: |
            artifacts/*.nupkg
            artifacts/*.zip

      - name: Create GitHub release
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME artifacts/*.nupkg artifacts/*.zip --generate-notes --title $env:GITHUB_REF_NAME
        env:
          GH_TOKEN: ${{ github.token }}
