name: .NET

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore TestFramework.sln

      - name: Build libraries
        if: runner.os != 'Windows'
        run: >-
          dotnet build TestFramework.Abstractions/TestFramework.Abstractions.csproj --configuration Release --no-restore &&
          dotnet build TestFramework.Core/TestFramework.Core.csproj --configuration Release --no-restore &&
          dotnet build TestFramework.SequenceYaml/TestFramework.SequenceYaml.csproj --configuration Release --no-restore &&
          dotnet build TestFramework.Plugins.BasicSteps/TestFramework.Plugins.BasicSteps.csproj --configuration Release --no-restore &&
          dotnet build TestFramework.Tests/TestFramework.Tests.csproj --configuration Release --no-restore

      - name: Build solution
        if: runner.os == 'Windows'
        run: dotnet build TestFramework.sln --configuration Release --no-restore

      - name: Test core
        if: runner.os != 'Windows'
        run: dotnet test TestFramework.Tests/TestFramework.Tests.csproj --configuration Release --no-build

      - name: Test solution
        if: runner.os == 'Windows'
        run: dotnet test TestFramework.sln --configuration Release --no-build

      # The release workflow only runs on a tag, so a packaging break would otherwise surface at
      # release time. Packing here proves the four libraries still produce their packages.
      - name: Pack smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet pack TestFramework.sln --configuration Release --no-build --output pack-smoke
          $packages = Get-ChildItem pack-smoke/*.nupkg | Select-Object -ExpandProperty Name
          Write-Host ($packages -join "`n")
          if ($packages.Count -ne 4) { throw "Expected 4 packages, found $($packages.Count)" }
