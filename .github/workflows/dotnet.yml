name: .NET

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore TestFramework.sln

      # Every project here is a library, a plugin or a headless test project. Since the desktop
      # host moved out of this repository there is nothing left that needs a display, so both
      # legs build and test the whole solution rather than a per-OS subset.
      - name: Build solution
        run: dotnet build TestFramework.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test TestFramework.sln --configuration Release --no-build

      # The release workflow only runs on a tag, so a packaging break would otherwise surface at
      # release time. Packing here proves the four libraries still produce their packages.
      - name: Pack smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet pack TestFramework.sln --configuration Release --no-build --output pack-smoke
          $packages = Get-ChildItem pack-smoke/*.nupkg | Select-Object -ExpandProperty Name
          Write-Host ($packages -join "`n")
          if ($packages.Count -ne 4) { throw "Expected 4 packages, found $($packages.Count)" }

      # The built-in step plugins are delivered as files into a host's Plugins/ directory, not as a
      # package, so their staging is not covered by the pack smoke test. A host copies from this
      # folder, which makes an empty one a broken delivery.
      - name: Built-in plugin package staged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staged = Get-ChildItem artifacts/plugins/BasicSteps -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host ($staged -join "`n")
          foreach ($expected in @('TestFramework.Plugins.BasicSteps.dll', 'TestFramework.Plugins.BasicSteps.UI.dll')) {
            if ($staged -notcontains $expected) { throw "Missing staged plugin: $expected" }
          }
